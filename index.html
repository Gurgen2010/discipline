<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title id="pageTitle">Կարգապահության պլանավորիչ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b0a;
    --panel: #121210;
    --line: #262521;
    --ink: #eae6dd;
    --ink-dim: #8c887f;
    --gold: #c9a24a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans Armenian', sans-serif;
    padding: 28px 18px 60px;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; }

  .topbar{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px; margin-bottom: 22px;
    flex-wrap: wrap; gap:12px;
  }
  .brand{ font-family:'Space Grotesk',sans-serif; font-size:15px; letter-spacing:0.04em; color:var(--ink-dim); }
  .topbar-right{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .weekpick{ display:flex; align-items:center; gap:10px; }
  .weekpick label{ font-size:12px; color:var(--ink-dim); }
  .weekpick input[type=date]{
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:6px 9px; font-family:'Noto Sans Armenian';
  }

  .lang-switch{ display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:3px; }
  .lang-btn{
    background:transparent; border:none; color:var(--ink-dim); font-family:'Space Grotesk',sans-serif;
    font-size:11px; font-weight:600; letter-spacing:0.03em; padding:5px 10px; border-radius:5px; cursor:pointer;
  }
  .lang-btn.active{ background:var(--gold); color:#141310; }

  .overview{
    display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom: 22px;
  }
  @media(max-width:760px){ .overview{ grid-template-columns:1fr; } }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px;
  }
  .card h2{
    margin:0 0 14px; font-size:12px; font-weight:600; letter-spacing:0.06em;
    color:var(--ink-dim); text-transform:none;
  }

  .goals-row{ display:flex; gap:18px; align-items:center; }
  .goals-list{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .goal-item{ display:flex; align-items:center; gap:9px; font-size:13.5px; }
  .goal-item input{ width:16px; height:16px; accent-color:#c9a24a; }
  .goal-item input:checked + span{ color:var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--line); }

  .ring-block{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:96px; }
  .ring-num{ font-family:'Space Grotesk'; font-size:13px; margin-top:2px; color:var(--ink-dim); }

  .stat-strip{ display:flex; gap:14px; margin-top:16px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:70px; text-align:center; background:#17160f; border:1px solid var(--line); border-radius:10px; padding:9px 4px; }
  .stat .n{ font-family:'Space Grotesk'; font-size:19px; font-weight:600; }
  .stat .l{ font-size:10.5px; color:var(--ink-dim); margin-top:2px; }
  .stat.best .n{ color:#7fbf8a; }
  .stat.worst .n{ color:#d17a72; }

  .progress-body{ display:flex; align-items:center; gap:18px; }
  .bars{ flex:1; display:flex; align-items:flex-end; gap:8px; height:80px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .bar{ width:100%; max-width:20px; background:#3b3a34; border-radius:3px 3px 0 0; transition: height .4s ease; }
  .bar.filled{ background:#c9a24a; }
  .bar-lbl{ font-size:10px; color:var(--ink-dim); }

  .week-grid{
    display:grid; grid-template-columns: repeat(7,1fr); gap:12px;
  }
  @media(max-width:980px){ .week-grid{ grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); } }

  .day-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 12px; display:flex; flex-direction:column; gap:10px; }
  .day-head{ text-align:center; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .day-name{ font-size:12.5px; font-weight:600; }
  .day-date{ font-size:10.5px; color:var(--ink-dim); margin-top:2px; }

  .task-list{ display:flex; flex-direction:column; gap:7px; min-height:150px; }
  .task{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; font-size:11.6px; line-height:1.3; }
  .task-content { display:flex; align-items:flex-start; gap:7px; flex:1; }
  .task input{ margin-top:2px; width:14px; height:14px; flex-shrink:0; accent-color:#c9a24a; }
  .task span{ transition: color .2s; word-break: break-word; }
  .task input:checked + span{ color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--line); }
  
  .delete-task-btn {
    background: none;
    border: none;
    color: #d17a72;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    line-height: 1;
    opacity: 0.7;
  }
  .delete-task-btn:hover { opacity: 1; }

  .add-task-box {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  .add-task-box input {
    flex: 1;
    background: #17160f;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: 'Noto Sans Armenian';
    font-size: 10.5px;
    padding: 5px 6px;
  }
  .add-task-box input:focus { outline: 1px solid var(--gold); }
  .add-task-box button {
    background: var(--gold);
    color: #141310;
    border: none;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-task-box button:hover { opacity: 0.9; }

  .day-counts{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-dim); border-top:1px solid var(--line); padding-top:7px; }
  .day-counts b{ color:var(--ink); font-weight:600; }

  .mini-tracker{ display:flex; flex-direction:column; gap:6px; }
  .mini-row{ display:flex; align-items:center; justify-content:space-between; font-size:10.5px; color:var(--ink-dim); gap:6px; }
  .mini-row .lbl{ white-space:nowrap; }
  .dots{ display:flex; gap:3px; }
  .dot{ width:12px; height:12px; border-radius:50%; border:1px solid var(--line); cursor:pointer; background:transparent; }
  .dot.on{ background:#c9a24a; border-color:#c9a24a; }

  .day-ring-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:4px; }
  .day-ring-lbl{ font-size:9.5px; color:var(--ink-dim); }

  svg.ring text{ font-family:'Space Grotesk'; }

  .day-note{
    width:100%; resize:none; min-height:40px; background:#17160f; border:1px solid var(--line);
    border-radius:8px; color:var(--ink); font-family:'Noto Sans Armenian'; font-size:11px;
    padding:6px 8px; line-height:1.35;
  }
  .day-note:focus{ outline:1px solid var(--gold); }
  .quote-card{
    text-align:center; border-color:var(--gold); background:linear-gradient(180deg,#1a1710,#121210);
    position:relative; padding:22px 24px;
  }
  .quote-mark{ font-family:'Space Grotesk'; font-size:34px; color:var(--gold); line-height:0.4; display:block; margin-bottom:6px; }

  .footnote{ text-align:center; color:var(--ink-dim); font-size:11px; margin-top:26px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand" id="brandText">ԿԱՐԳԱՊԱՀՈՒԹՅԱՆ ՊԼԱՆԱՎՈՐԻՉ · V2</div>
    <div class="topbar-right">
      <div class="lang-switch" id="langSwitch">
        <button class="lang-btn" data-lang="hy">ՀԱՅ</button>
        <button class="lang-btn" data-lang="ru">РУ</button>
        <button class="lang-btn" data-lang="en">EN</button>

      <div class="weekpick">

        <input type="date" id="weekStart">

    </div>
  </div>

  <div class="card quote-card" style="margin-bottom:22px;">

    <div id="quoteText" style="font-size:17px; font-weight:600; color:var(--ink); letter-spacing:0.01em;"></div>
    <button id="nextQuoteBtn" style="margin-top:12px; background:transparent; border:1px solid var(--line); color:var(--ink-dim); border-radius:20px; padding:5px 14px; font-size:11px; cursor:pointer; font-family:'Noto Sans Armenian';"></button>
    <details style="margin-top:14px; text-align:left;">
      <summary id="manageQuotesSummary" style="cursor:pointer; font-size:11px; color:var(--ink-dim); text-align:center;"></summary>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input id="newQuoteInput" type="text" style="flex:1; background:#17160f; border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:7px 10px; font-family:'Noto Sans Armenian'; font-size:12px;">
        <button id="addQuoteBtn" style="background:var(--gold); border:none; color:#141310; border-radius:6px; padding:7px 14px; font-size:12px; cursor:pointer; font-family:'Noto Sans Armenian'; font-weight:600;"></button>
      </div>
      <div id="myQuotesList" style="display:flex; flex-direction:column; gap:6px; margin-top:10px; max-height:160px; overflow-y:auto;"></div>
    </details>
  </div>

  <div class="overview">
    <div class="card">
      <h2 id="goalsHeader">ՆՊԱՏԱԿՆԵՐ ՇԱԲԱԹՎԱ ՀԱՄԱՐ</h2>
      <div class="goals-row">
        <div class="goals-list" id="goalsList"></div>
        <div class="ring-block">
          <div id="goalsRingHolder"></div>
          <div class="ring-num" id="goalsRingLabel">0%</div>
        </div>
      </div>
      <div class="stat-strip" id="goalStatStrip"></div>
    </div>

    <div class="card">
      <h2 id="weeklyProgressHeader">ՇԱԲԱԹԱԿԱՆ ԱՌԱՋԸՆԹԱՑ</h2>
      <div class="progress-body">
        <div class="bars" id="barsHolder"></div>
        <div class="ring-block">
          <div id="weekRingHolder"></div>
          <div class="ring-num" id="weekRingLabel">0%</div>
        </div>
      </div>
      <div class="stat-strip">
        <div class="stat best"><div class="n" id="bestDayName">—</div><div class="l" id="bestDayLabel"></div></div>
        <div class="stat worst"><div class="n" id="worstDayName">—</div><div class="l" id="worstDayLabel"></div></div>
        <div class="stat"><div class="n" id="avgPct">0%</div><div class="l" id="avgLabel"></div></div>
        <div class="stat"><div class="n" id="streakNum">0</div><div class="l" id="streakLabel"></div></div>
        <div class="stat"><div class="n" id="bestStreakNum">0</div><div class="l" id="bestStreakLabel"></div></div>
      </div>
    </div>
  </div>

  <div class="week-grid" id="weekGrid"></div>

  <div class="overview" style="margin-top:16px;">
    <div class="card" id="historyCard" style="display:none;">
      <h2 id="historyHeader">ՆԱԽՈՐԴ ՇԱԲԱԹՆԵՐ</h2>
      <div class="bars" id="historyBars" style="height:60px;"></div>
    </div>
    <div class="card">
      <h2 id="reflectionHeader">ՇԱԲԱԹՎԱ ԱՄՓՈՓՈՒՄ</h2>
      <textarea class="day-note" id="weeklyReflection" style="min-height:60px;"></textarea>
    </div>
  </div>

  <div class="footnote" id="footnoteText">Տվյալները պահվում են ավտոմատ քո զննարկիչում այս սարքի համար</div>
</div>

    addTaskBtn: "Добавить",
    dayRingLabel: "Выполнено за день",
    energyLabel: "⚡ Энергия",
    doneColon: "Выполнено:",
    remainingColon: "Осталось:",
    footnote: "Данные сохраняются автоматически в браузере на этом устройстве"
  },
  en: {
    pageTitle: "Discipline Planner",
    brand: "DISCIPLINE PLANNER · V2",
    weekStartLabel: "Week start",
    quoteNextBtn: "Next thought →",
    manageQuotesSummary: "Manage quotes (add/delete your own)",
    newQuotePlaceholder: "Write your own thought...",
    addQuoteBtn: "+ Add",
    noCustomQuotes: "No custom quotes yet.",
    goalsHeader: "GOALS FOR THE WEEK",
    weeklyProgressHeader: "WEEKLY PROGRESS",
    totalTasksLabel: "Total tasks",
    doneLabel: "Done",
    remainingLabel: "Remaining",
    bestDayLabel: "Best day",
    worstDayLabel: "Weakest day",
    avgLabel: "Average %",
    streakLabel: "🔥 Streak (days)",
    bestStreakLabel: "🏆 Best",
    historyHeader: "PAST WEEKS",
    reflectionHeader: "WEEKLY SUMMARY",
    reflectionPlaceholder: "Short takeaway from this week...",
    dayNotePlaceholder: "Short note about today...",
    newTaskPlaceholder: "New task...",
    addTaskBtn: "Add",
    dayRingLabel: "Done for the day",
    energyLabel: "⚡ Energy",
    doneColon: "Done:",
    remainingColon: "Left:",
    footnote: "Data is saved automatically in your browser on this device"
  }
};

function t(key){ return I18N[state.lang] && I18N[state.lang][key] ? I18N[state.lang][key] : key; }

let state = {
  weekStart: null,
  lang: 'hy',
  goals: [],
  quoteIndex: 0,
  myQuotes: [],
  bestStreak: 0,
  weekHistory: [],
  weeklyReflection: '',
  days: []
};

const STORAGE_KEY = 'discipline-planner-state-v3';

function mondayOf(d){
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  const nd = new Date(d);
  nd.setDate(nd.getDate()+diff);
  return nd.toISOString().slice(0,10);
}

async function loadState(){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state = Object.assign(state, parsed);
      }
    } else {
      const saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        const parsed = JSON.parse(saved);
        state = Object.assign(state, parsed);
      }
    }
  }catch(e){ /* no saved state */ }

  const currentMonday = mondayOf(new Date());
  if(!state.weekStart){
    state.weekStart = currentMonday;
  }

  if(!['hy','ru','en'].includes(state.lang)) state.lang = 'hy';

  const goalCount = GOALS[state.lang] ? GOALS[state.lang].length : 6;
  if(!Array.isArray(state.goals) || state.goals.length !== goalCount){
    state.goals = Array(goalCount).fill(false);
  }

  if(!Array.isArray(state.days) || state.days.length !== 7){
    state.days = Array(7).fill(0).map(()=>({tasks: [], energy: 3, note: ''}));
  }

  state.days.forEach(d => {
    if(!d || typeof d !== 'object') return;
    if(!Array.isArray(d.tasks)){
      d.tasks = [];
    }
    if(d.tasks.length === 0 && DEFAULT_TASKS[state.lang]){
      DEFAULT_TASKS[state.lang].forEach(text => {
        d.tasks.push({ text: text, done: false });
      });
    } else {
      d.tasks = d.tasks.map(t => typeof t === 'string' ? { text: t, done: false } : t);
    }
    if(typeof d.energy !== 'number') d.energy = 3;
    if(typeof d.note !== 'string') d.note = '';
  });

  if(!Array.isArray(state.myQuotes)) state.myQuotes = [];
  if(typeof state.bestStreak !== 'number') state.bestStreak = 0;
  if(!Array.isArray(state.weekHistory)) state.weekHistory = [];
  if(typeof state.weeklyReflection !== 'string') state.weeklyReflection = '';

  const wsInput = document.getElementById('weekStart');
  if(wsInput) wsInput.value = state.weekStart;
}

async function saveState(){
  try{
    const dataStr = JSON.stringify(state);
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(STORAGE_KEY, dataStr, false);
    }
    localStorage.setItem(STORAGE_KEY, dataStr);
  }catch(e){ console.error('storage error', e); }
}

function ringSVG(pct, size, stroke, color, id){
  const r = (size - stroke)/2;
  const c = 2*Math.PI*r;
  const off = c * (1 - Math.min(100, Math.max(0, pct))/100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#262521" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})" style="transition: stroke-dashoffset .4s ease"/>
    <text x="50%" y="53%" text-anchor="middle" fill="#eae6dd" font-size="${size*0.24}" font-weight="600">${Math.round(pct)}%</text>
  </svg>`;
}

function dateForDayIndex(i){
  if(!state.weekStart) return '';
  const d = new Date(state.weekStart + 'T00:00:00');
  d.setDate(d.getDate()+i);
  return d.toLocaleDateString(LOCALE[state.lang] || 'hy-AM', {day:'2-digit', month:'short'});
}

function computeDayPct(dayIdx){
  if(!state.days[dayIdx] || !state.days[dayIdx].tasks) return { done: 0, total: 0, pct: 0 };
  const arr = state.days[dayIdx].tasks;
  if(arr.length === 0) return { done: 0, total: 0, pct: 0 };
  const done = arr.filter(t => t && t.done).length;
  return { done, total: arr.length, pct: (done/arr.length)*100 };
}

function computeStreak(){
  let streak = 0;
  for(let i=0; i<state.days.length; i++){
    const stat = computeDayPct(i);
    if(stat.total > 0 && stat.done > 0) streak++;
    else if(stat.total === 0) continue;
    else break;
  }
  return streak;
}

function computeGoalsPct(){
  const goalsArr = GOALS[state.lang] || [];
  if(!Array.isArray(state.goals)) state.goals = [];
  const done = state.goals.filter(Boolean).length;
  return { done, total: goalsArr.length, pct: goalsArr.length > 0 ? (done/goalsArr.length)*100 : 0 };
}

function render(){
  const lang = state.lang;
  const goalsArr = GOALS[lang] || [];
  const dayNamesArr = DAY_NAMES[lang] || DAY_NAMES.hy;
  const dayShortArr = DAY_SHORT[lang] || DAY_SHORT.hy;

  document.getElementById('pageTitle').textContent = t('pageTitle');
  document.documentElement.lang = lang;
  document.getElementById('brandText').textContent = t('brand');
  document.getElementById('weekStartLabel').textContent = t('weekStartLabel');
  document.getElementById('nextQuoteBtn').textContent = t('quoteNextBtn');
  document.getElementById('manageQuotesSummary').textContent = t('manageQuotesSummary');
  document.getElementById('newQuoteInput').placeholder = t('newQuotePlaceholder');
  document.getElementById('addQuoteBtn').textContent = t('addQuoteBtn');
  document.getElementById('goalsHeader').textContent = t('goalsHeader');
  document.getElementById('weeklyProgressHeader').textContent = t('weeklyProgressHeader');
  document.getElementById('bestDayLabel').textContent = t('bestDayLabel');
  document.getElementById('worstDayLabel').textContent = t('worstDayLabel');
  document.getElementById('avgLabel').textContent = t('avgLabel');
  document.getElementById('streakLabel').textContent = t('streakLabel');
  document.getElementById('bestStreakLabel').textContent = t('bestStreakLabel');
  document.getElementById('historyHeader').textContent = t('historyHeader');
  document.getElementById('reflectionHeader').textContent = t('reflectionHeader');
  document.getElementById('weeklyReflection').placeholder = t('reflectionPlaceholder');
  document.getElementById('footnoteText').textContent = t('footnote');

  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  const baseQuotes = QUOTES[lang] || QUOTES.hy;
  const allQuotes = baseQuotes.concat(state.myQuotes || []);
  if(typeof state.quoteIndex !== 'number') state.quoteIndex = 0;
  document.getElementById('quoteText').textContent = allQuotes[state.quoteIndex % allQuotes.length] || '';

  document.getElementById('myQuotesList').innerHTML = (state.myQuotes && state.myQuotes.length) ? state.myQuotes.map((q,i)=>`
    <div style="display:flex; align-items:flex-start; gap:8px; font-size:11.5px; color:var(--ink-dim); border-bottom:1px solid var(--line); padding-bottom:6px;">
      <span style="flex:1;">${escapeHtml(q)}</span>
      <button data-del-quote="${i}" style="background:transparent; border:none; color:#d17a72; cursor:pointer; font-size:13px; flex-shrink:0;">✕</button>
    </div>
  `).join('') : `<div style="font-size:11px; color:var(--ink-dim);">${t('noCustomQuotes')}</div>`;

  const goalsList = document.getElementById('goalsList');
  goalsList.innerHTML = goalsArr.map((g,i)=>`
    <label class="goal-item">
      <input type="checkbox" data-goal="${i}" ${state.goals[i] ? 'checked':''}>
      <span>${g}</span>
    </label>
  `).join('');
  const gStat = computeGoalsPct();
  document.getElementById('goalsRingHolder').innerHTML = ringSVG(gStat.pct, 84, 8, '#c9a24a');
  document.getElementById('goalsRingLabel').textContent = `${gStat.done} / ${gStat.total}`;

  let totalDone = 0, totalPossible = 0;
  state.days.forEach(d => {
    if(d && d.tasks){
      totalDone += d.tasks.filter(t => t && t.done).length;
      totalPossible += d.tasks.length;
    }
  });

  document.getElementById('goalStatStrip').innerHTML = `
    <div class="stat"><div class="n">${totalPossible}</div><div class="l">${t('totalTasksLabel')}</div></div>
    <div class="stat best"><div class="n">${totalDone}</div><div class="l">${t('doneLabel')}</div></div>
    <div class="stat worst"><div class="n">${totalPossible-totalDone}</div><div class="l">${t('remainingLabel')}</div></div>
  `;

  const dayStats = state.days.map((d,i)=>computeDayPct(i));
  const barsHolder = document.getElementById('barsHolder');
  barsHolder.innerHTML = dayStats.map((s,i)=>{
    const h = Math.max(4, s.total > 0 ? (s.done/s.total) * 76 : 4);
    return `<div class="bar-col">
      <div class="bar ${s.done>0?'filled':''}" style="height:${h}px"></div>
      <div class="bar-lbl">${dayShortArr[i]}</div>
    </div>`;
  }).join('');

  const weekPct = (totalPossible>0) ? (totalDone/totalPossible*100) : 0;
  document.getElementById('weekRingHolder').innerHTML = ringSVG(weekPct, 84, 8, '#c9a24a');
  document.getElementById('weekRingLabel').textContent = `${Math.round(weekPct)}%`;

  let bestIdx = 0, worstIdx = 0;
  dayStats.forEach((s,i)=>{
    if(s.pct > dayStats[bestIdx].pct) bestIdx = i;
    if(s.pct < dayStats[worstIdx].pct) worstIdx = i;
  });
  document.getElementById('bestDayName').textContent = totalDone>0 ? dayShortArr[bestIdx] : '—';
  document.getElementById('worstDayName').textContent = totalDone>0 ? dayShortArr[worstIdx] : '—';
  document.getElementById('avgPct').textContent = `${Math.round(weekPct)}%`;
  const curStreak = computeStreak();
  if(curStreak > state.bestStreak){ state.bestStreak = curStreak; saveState(); }
  document.getElementById('streakNum').textContent = curStreak;
  document.getElementById('bestStreakNum').textContent = state.bestStreak;

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = dayNamesArr.map((name,i)=>{
    const stat = dayStats[i];
    const tasksArr = (state.days[i] && state.days[i].tasks) ? state.days[i].tasks : [];
    
    let tasksHtml = '';
    if(tasksArr.length > 0){
      tasksHtml = tasksArr.map((tsk,ti)=>`
        <div class="task">
          <div class="task-content">
            <input type="checkbox" data-day="${i}" data-task="${ti}" ${tsk && tsk.done ? 'checked':''}>
            <span class="${tsk && tsk.done ? 'completed' : ''}">${escapeHtml(tsk ? tsk.text : '')}</span>
          </div>
          <button class="delete-task-btn" data-del-day="${i}" data-del-task="${ti}" title="Ջնջել">&times;</button>
        </div>
      `).join('');
    } else {
      tasksHtml = `<div style="font-size:11px; color:var(--ink-dim); text-align:center; padding:15px 0;">Առաջադրանքներ չկան</div>`;
    }

    const energyVal = (state.days[i] && typeof state.days[i].energy === 'number') ? state.days[i].energy : 3;
    const energyDots = [1,2,3,4,5].map(v=>`<div class="dot ${energyVal>=v?'on':''}" data-day="${i}" data-energy="${v}"></div>`).join('');
    const noteVal = (state.days[i] && state.days[i].note) ? state.days[i].note : '';

    return `
      <div class="day-card">
        <div class="day-head">
          <div class="day-name">${name}</div>
          <div class="day-date">${dateForDayIndex(i)}</div>
        </div>
        <div class="task-list">${tasksHtml}</div>
        
        <div class="add-task-box">
          <input type="text" id="task-input-${i}" placeholder="${t('newTaskPlaceholder')}">
          <button data-add-day="${i}">${t('addTaskBtn')}</button>
        </div>

        <div class="day-counts"><span>${t('doneColon')} <b>${stat.done}</b></span><span>${t('remainingColon')} <b>${stat.total-stat.done}</b></span></div>
        <textarea class="day-note" data-note="${i}" placeholder="${t('dayNotePlaceholder')}">${noteVal}</textarea>
        <div class="mini-tracker">
          <div class="mini-row"><span class="lbl">${t('energyLabel')}</span><div class="dots">${energyDots}</div></div>
        </div>
        <div class="day-ring-wrap">
          ${ringSVG(stat.pct, 60, 6, stat.pct===100 ? '#7fbf8a' : '#c9a24a')}
          <div class="day-ring-lbl">${t('dayRingLabel')}</div>
        </div>
      </div>
    `;
  }).join('');

  const historyCard = document.getElementById('historyCard');
  const reflectionCard = historyCard.parentElement.children[1];
  if(state.weekHistory && state.weekHistory.length){
    historyCard.style.display = '';
    reflectionCard.style.gridColumn = '';
    const maxPct = Math.max(1, ...state.weekHistory.map(w=>w.pct));
    document.getElementById('historyBars').innerHTML = state.weekHistory.map(w=>{
      const h = Math.max(4, (w.pct/maxPct) * 46);
      const d = new Date(w.weekStart + 'T00:00:00');
      const lbl = d.toLocaleDateString(LOCALE[state.lang] || 'hy-AM', {day:'2-digit', month:'short'});
      return `<div class="bar-col">
        <div class="bar filled" style="height:${h}px" title="${w.pct}%"></div>
        <div class="bar-lbl">${lbl}</div>
      </div>`;
    }).join('');
  }else{
    historyCard.style.display = 'none';
    reflectionCard.style.gridColumn = '1 / -1';
  }

  const reflectionEl = document.getElementById('weeklyReflection');
  if(document.activeElement !== reflectionEl){
    reflectionEl.value = state.weeklyReflection || '';
  }

  attachHandlers();
}

function escapeHtml(text) {
  if(!text) return '';
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
}

function addNewTask(dayIndex){
  const input = document.getElementById(`task-input-${dayIndex}`);
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;

  if(!state.days[dayIndex]) state.days[dayIndex] = { tasks: [], energy: 3, note: '' };
  if(!Array.isArray(state.days[dayIndex].tasks)) state.days[dayIndex].tasks = [];
  
  state.days[dayIndex].tasks.push({ text: text, done: false });
  input.value = '';
  saveState();
  render();
}

function attachHandlers(){
  document.querySelectorAll('[data-goal]').forEach(el=>{
    el.onchange = () => {
      const idx = +el.dataset.goal;
      while(state.goals.length <= idx) state.goals.push(false);
      state.goals[idx] = el.checked;
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-day][data-task]').forEach(el=>{
    el.onchange = () => {
      const d = +el.dataset.day, tsk = +el.dataset.task;
      if(state.days[d] && state.days[d].tasks && state.days[d].tasks[tsk]){
        state.days[d].tasks[tsk].done = el.checked;
        saveState(); render();
      }
    };
  });
  document.querySelectorAll('[data-del-task]').forEach(el=>{
    el.onclick = () => {
      const d = +el.dataset.delDay, tsk = +el.dataset.delTask;
      if(state.days[d] && state.days[d].tasks){
        state.days[d].tasks.splice(tsk, 1);
        saveState(); render();
      }
    };
  });
  document.querySelectorAll('[data-add-day]').forEach(el=>{
    el.onclick = () => {
      addNewTask(+el.dataset.addDay);
    };
  });
  document.querySelectorAll('.add-task-box input').forEach(el=>{
    el.onkeydown = (e) => {
      if(e.key === 'Enter'){
        const dayIndex = el.id.replace('task-input-', '');
        addNewTask(+dayIndex);
      }
    };
  });
  document.querySelectorAll('.dot[data-energy]').forEach(el=>{
    el.onclick = () => {
      const d = +el.dataset.day, v = +el.dataset.energy;
      if(!state.days[d]) state.days[d] = { tasks: [], energy: 3, note: '' };
      state.days[d].energy = (state.days[d].energy === v) ? v-1 : v;
      saveState(); render();
    };
  });
  document.querySelectorAll('.day-note').forEach(el=>{
    el.onchange = () => {
      const d = +el.dataset.note;
      if(!state.days[d]) state.days[d] = { tasks: [], energy: 3, note: '' };
      state.days[d].note = el.value;
      saveState();
    };
  });
  const nextBtn = document.getElementById('nextQuoteBtn');
  if(nextBtn){
    nextBtn.onclick = () => {
      const baseQuotes = QUOTES[state.lang] || QUOTES.hy;
      const total = baseQuotes.length + (state.myQuotes ? state.myQuotes.length : 0);
      state.quoteIndex = (state.quoteIndex + 1) % total;
      saveState(); render();
    };
  }
  const addQBtn = document.getElementById('addQuoteBtn');
  if(addQBtn){
    addQBtn.onclick = () => {
      const input = document.getElementById('newQuoteInput');
      const val = input.value.trim();
      if(val){
        if(!Array.isArray(state.myQuotes)) state.myQuotes = [];
        state.myQuotes.push(val);
        input.value = '';
        saveState(); render();
      }
    };
  }
  const newQInput = document.getElementById('newQuoteInput');
  if(newQInput){
    newQInput.onkeydown = (e) => {
      if(e.key === 'Enter'){ document.getElementById('addQuoteBtn').click(); }
    };
  }
  document.querySelectorAll('[data-del-quote]').forEach(el=>{
    el.onclick = () => {
      const idx = +el.dataset.delQuote;
      if(state.myQuotes){
        state.myQuotes.splice(idx, 1);
        const baseQuotes = QUOTES[state.lang] || QUOTES.hy;
        if(state.quoteIndex >= baseQuotes.length + state.myQuotes.length) state.quoteIndex = 0;
        saveState(); render();
      }
    };
  });
  const ws = document.getElementById('weekStart');
  if(ws){
    ws.onchange = (e) => {
      state.weekStart = e.target.value;
      saveState(); render();
    };
  }
  const refl = document.getElementById('weeklyReflection');
  if(refl){
    refl.onchange = (e) => {
      state.weeklyReflection = e.target.value;
      saveState();
    };
  }
  document.querySelectorAll('.lang-btn').forEach(el=>{
    el.onclick = () => {
      state.lang = el.dataset.lang;
      // Վերահաշվարկել նպատակների զանգվածը նոր լեզվի համար
      const goalCount = GOALS[state.lang] ? GOALS[state.lang].length : 6;
      if(!Array.isArray(state.goals) || state.goals.length !== goalCount){
        state.goals = Array(goalCount).fill(false);
      }
      saveState(); render();
    };
  });
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
